<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ytmusic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top YouTube Masthead Search & Utility Bar (46px) -->
    <header class="top-bar">
      <form id="search-form" class="search-box">
        <input
          id="search-input"
          type="text"
          placeholder="Search"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="search-btn" type="submit" class="search-submit" title="Search YouTube (builds 30-song list)">
          <svg id="search-btn-icon" class="search-btn-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <span id="search-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <button id="theme-btn" type="button" class="icon-btn theme-btn" title="Switch to Light theme (T)">
        <svg id="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
        <svg id="moon-icon" class="hidden" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
      </button>

      <button id="pin-btn" type="button" class="icon-btn pin-btn" title="Stay on top">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>
        </svg>
      </button>

      <button id="auth-btn" type="button" class="icon-btn auth-btn" title="Sign in with Google">
        <svg class="google-g" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
        <span id="auth-dot" class="auth-dot"></span>
      </button>

      <button id="quit-btn" type="button" class="icon-btn quit-btn" title="Save & Exit ytmusic">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A6.92 6.92 0 0 1 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.12.94-4.01 2.42-5.29L6.01 5.3A8.93 8.93 0 0 0 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
        </svg>
      </button>
    </header>

    <!-- Account Popover (when signed in) -->
    <div id="auth-popover" class="auth-popover hidden">
      <div class="auth-popover-info">
        <span class="auth-label">YouTube Account</span>
        <strong id="auth-account-name">Signed In</strong>
      </div>
      <div class="auth-popover-actions">
        <button id="auth-signout-btn" type="button" class="pill-btn danger">Sign Out</button>
        <button id="auth-close-btn" type="button" class="pill-btn">Close</button>
      </div>
    </div>

    <!-- Collapsible Video Viewport (0px default / 214px when enabled) -->
    <section id="video-pane" class="video-pane">
      <video id="media-player" playsinline preload="metadata"></video>
      <div id="video-loading-overlay" class="video-loading hidden">
        <span class="spinner lg"></span>
      </div>
    </section>

    <!-- Main Player Deck (126px) -->
    <section class="player-deck">
      <div class="now-playing">
        <div class="thumb-wrap">
          <img id="current-thumb" src="" alt="" class="hidden" />
          <div id="thumb-placeholder" class="thumb-placeholder">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
          </div>
        </div>
        <div class="track-meta">
          <div id="current-title" class="track-title">Search for a song to start</div>
          <div id="current-artist" class="track-artist">Audio-only mode • 30-song playlist</div>
        </div>
        <button id="like-btn" type="button" class="ctrl-btn sm like-btn" title="Like / Unlike song" aria-label="Like song">
          <svg id="heart-outline-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>
          <svg id="heart-filled-icon" class="hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
        <div id="track-counter" class="track-counter">0/0</div>
      </div>

      <!-- Seekable Progress Bar -->
      <div class="progress-row">
        <span id="time-elapsed" class="time-label">0:00</span>
        <div class="progress-wrap">
          <div id="progress-buffer" class="progress-buffer"></div>
          <div id="progress-fill" class="progress-fill"></div>
          <input id="progress-range" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek track" />
        </div>
        <span id="time-total" class="time-label">0:00</span>
      </div>

      <!-- Transport & Mode Controls -->
      <div class="controls-row">
        <div class="transport">
          <button id="shuffle-btn" type="button" class="ctrl-btn xs" title="Shuffle (S)">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>
          <button id="prev-btn" type="button" class="ctrl-btn" title="Previous song">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button id="play-btn" type="button" class="play-btn" title="Play / Pause (Space)">
            <svg id="play-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" class="hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button id="next-btn" type="button" class="ctrl-btn" title="Next song">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
          <button id="repeat-btn" type="button" class="ctrl-btn xs" title="Repeat: Off (R)">
            <svg id="repeat-all-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <svg id="repeat-one-icon" class="hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>
          </button>
        </div>

        <div class="volume-wrap">
          <button id="mute-btn" type="button" class="ctrl-btn sm" title="Mute / Unmute (M)">
            <svg id="vol-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <svg id="mute-icon" class="hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <input id="volume-range" type="range" min="0" max="1" step="0.02" value="0.8" aria-label="Volume" />
        </div>

        <div class="mode-toggles">
          <button id="video-toggle-btn" type="button" class="toggle-pill" title="Toggle video playback (V)">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            <span>Video</span>
          </button>
          <button id="playlist-toggle-btn" type="button" class="toggle-pill" title="Expand or hide playlist (L)">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
            <span>List</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Collapsible Playlist Drawer (0px hidden / remaining height when expanded) -->
    <section id="playlist-drawer" class="playlist-drawer">
      <div class="drawer-toolbar">
        <div class="drawer-tabs">
          <button id="tab-queue" type="button" class="tab-pill active">Queue</button>
          <button id="tab-liked" type="button" class="tab-pill">Liked ♥</button>
          <button id="tab-saved" type="button" class="tab-pill">Saved</button>
          <button id="save-queue-btn" type="button" class="tab-pill save-btn" title="Save current playlist">+ Save</button>
        </div>
        <div id="save-queue-bar" class="save-queue-bar hidden">
          <input id="save-queue-input" type="text" placeholder="Playlist name..." autocomplete="off" spellcheck="false" />
          <button id="save-queue-confirm" type="button" class="pill-btn accent">Save</button>
          <button id="save-queue-cancel" type="button" class="pill-btn">Cancel</button>
        </div>
        <div id="filter-row" class="filter-row">
          <input id="playlist-filter" type="text" placeholder="Filter tracks..." autocomplete="off" spellcheck="false" />
          <button id="play-liked-btn" type="button" class="pill-btn accent hidden">Play All</button>
        </div>
      </div>

      <div id="playlist-scroll" class="playlist-scroll">
        <div id="playlist-list" class="playlist-list"></div>
        <div id="playlist-empty" class="playlist-empty">
          Search for any song or artist above to build a 30-song playlist.
        </div>
        <div id="load-more-footer" class="load-more-footer hidden">
          <span class="spinner"></span>
          <span>Adding more songs...</span>
        </div>
      </div>
    </section>

    <div id="status-toast" class="status-toast hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
